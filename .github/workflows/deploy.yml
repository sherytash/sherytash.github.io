# Deploys the built site to GitHub Pages.
#
# build.py copies this file to dist/.github/workflows/deploy.yml. It runs in
# the public repository sherytash.github.io, whose root is dist/: the files
# there are already the finished site, so nothing is built here. The source
# folder (one level up) stays private and is never pushed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
